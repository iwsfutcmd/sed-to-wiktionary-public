# Publishes ONLY the SEDonline browser (site/sedonline.html, from the public sed-online.ru data) to GitHub Pages.
# site/index.html is deliberately not deployed: it is built from the SED book scans, which stay private.
# Setup (once): Settings > Pages > Source: "GitHub Actions". Then run this workflow from the Actions tab.
name: Deploy SEDonline browser to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp site/sedonline.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
