# Mirrors main to the public repo, minus all PDFs (scripts/sync_public.sh).
# Setup (once): add a repo secret PUBLIC_REPO_TOKEN, a fine-grained PAT with Contents: read/write on the public repo.
name: Sync public mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    if: github.repository == 'iwsfutcmd/sed-to-wiktionary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install git-filter-repo
      - run: scripts/sync_public.sh "https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/iwsfutcmd/sed-to-wiktionary-public.git"
